name: Build Genius PDF
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o Genius-PDF-Source.zip -d src
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build APK
        working-directory: src
        run: |
          npm ci
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#2C3BC4" --splashBackgroundColor "#F1F2F6" || true
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../../Genius-PDF.apk
      - uses: actions/upload-artifact@v4
        with: { name: Genius-PDF-Android, path: Genius-PDF.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: Expand-Archive -Path Genius-PDF-Source.zip -DestinationPath src -Force
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build installer
        working-directory: src
        run: |
          npm ci
          npx electron-builder --win nsis portable --x64 --publish never -c.win.signAndEditExecutable=true
      - uses: actions/upload-artifact@v4
        with: { name: Genius-PDF-Windows, path: src/dist/*.exe }
