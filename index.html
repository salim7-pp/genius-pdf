<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Salim Bouzenad">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Genius PDF</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: tool catalogue (category chips + card grid); each tool = file stage + options panel */
:root{
  --bg:#F1F2F6; --surface:#FFFFFF; --sunk:#E7E9EF; --fg:#141721; --muted:#596072; --line:#D8DBE4; --paper:#FFFFFF;
  --accent:#2C3BC4; --accent-fg:#FFFFFF;
  --c-org:#2C3BC4; --c-opt:#0A7C55; --c-to:#AD5B06; --c-from:#B8401C; --c-edit:#7D33B8; --c-sec:#0E6E86; --c-ai:#B02A72;
  --danger:#BF2637; --ok:#0A7C55;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,23,33,.06),0 6px 18px rgba(20,23,33,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1016; --surface:#171A22; --sunk:#1F232D; --fg:#E7E9F0; --muted:#9BA1B0; --line:#2B303C;
  --accent:#8592FF; --accent-fg:#0E1016;
  --c-org:#8592FF; --c-opt:#3CC690; --c-to:#F0A24E; --c-from:#FF8A62; --c-edit:#C38DF3; --c-sec:#4CC3DE; --c-ai:#F47AB8;
  --danger:#FF6B7A; --ok:#3CC690; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1016; --surface:#171A22; --sunk:#1F232D; --fg:#E7E9F0; --muted:#9BA1B0; --line:#2B303C;
  --accent:#8592FF; --accent-fg:#0E1016;
  --c-org:#8592FF; --c-opt:#3CC690; --c-to:#F0A24E; --c-from:#FF8A62; --c-edit:#C38DF3; --c-sec:#4CC3DE; --c-ai:#F47AB8;
  --danger:#FF6B7A; --ok:#3CC690; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px;border-bottom:1px solid var(--line);margin-bottom:26px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-family:var(--f-display);font-weight:700;font-size:20px}
.mark{width:32px;height:38px;background:var(--accent);border-radius:4px;clip-path:polygon(0 0,70% 0,100% 24%,100% 100%,0 100%);display:grid;place-items:end center;padding-bottom:5px;color:var(--accent-fg);font:700 9.5px/1 var(--f-display);letter-spacing:.06em}
.privacy{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.privacy svg{color:var(--ok);flex:none}

/* home */
.intro{max-width:64ch;margin-bottom:20px}
.intro h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1.25;margin:0 0 8px;text-wrap:balance}
.intro p{margin:0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500}
.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--fg);transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--tc);transform:translateY(-2px);box-shadow:var(--shadow)}
.card b{font-family:var(--f-display);font-weight:600;font-size:16.5px}
.card .d{color:var(--muted);font-size:13px;line-height:1.6}
.card .tag{align-self:flex-start;font-size:11px;font-weight:600;color:var(--tc);background:color-mix(in srgb,var(--tc) 11%,var(--surface));padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.ticon{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,var(--surface))}
.ticon svg{width:24px;height:24px}
.limits{margin-top:26px;padding:14px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13.5px;max-width:80ch}

/* tool */
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:14px}
.back:hover{color:var(--fg)}
.tool-head{display:flex;gap:14px;align-items:center;margin-bottom:22px}
.tool-head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.4vw,30px);margin:0;line-height:1.3}
.tool-head p{margin:2px 0 0;color:var(--muted);max-width:64ch}
.tool-head .ticon{width:52px;height:52px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media (max-width:840px){.work{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0;display:flex;flex-direction:column;gap:14px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:44px 20px;border:2px dashed color-mix(in srgb,var(--tc) 45%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--tc) 5%,var(--surface));cursor:pointer;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{background:color-mix(in srgb,var(--tc) 11%,var(--surface));border-color:var(--tc)}
.drop b{font-family:var(--f-display);font-weight:600;font-size:18px}
.drop .sub{color:var(--muted);font-size:14px}
.drop .up{width:46px;height:46px;border-radius:50%;background:var(--tc);color:var(--surface);display:grid;place-items:center;margin-bottom:8px}
.drop .up svg{width:22px;height:22px}
.drop.compact{flex-direction:row;padding:14px 18px;gap:12px;justify-content:flex-start;text-align:start}
.drop.compact .up{width:34px;height:34px;margin:0}
.drop.compact b{font-size:15px}
.drop.compact .sub{display:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.sample{align-self:center;background:none;border:0;color:var(--tc);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px;padding:4px}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.fcard{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.ord{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.fthumb{flex:none;width:46px;height:58px;border-radius:4px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.fthumb img{width:100%;height:100%;object-fit:cover}
.ext{font:700 10.5px var(--f-display);color:var(--tc);letter-spacing:.04em}
.fmeta{flex:1;min-width:0}
.fmeta b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.fmeta em{display:block;color:var(--danger);font-style:normal;font-size:13px}
.fact{display:flex;gap:4px}
.ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:14px;line-height:1}
.ib:hover:not(:disabled){border-color:var(--fg)}
.ib:disabled{opacity:.35;cursor:default}
.ib.del:hover{border-color:var(--danger);color:var(--danger)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--tc);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.org-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.link{background:none;border:0;color:var(--tc);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.pg{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.pthumb{aspect-ratio:3/4;max-width:100%;background:var(--sunk);border-radius:4px;display:grid;place-items:center;overflow:hidden}
.pthumb img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .2s;box-shadow:0 0 0 1px var(--line)}
.pg figcaption{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pg figcaption .pn{color:var(--fg);font-weight:600}
.pact{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pact .ib{width:auto;height:28px}
.aiout{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;line-height:1.85;max-height:65vh;overflow:auto;unicode-bidi:plaintext}
.aiout:empty::before{content:"يفكّر Claude…";color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:840px){.panel{position:static}}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:16px;margin:0}
.opts{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.lb{font-size:13px;font-weight:600;color:var(--muted)}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.fld textarea{resize:vertical;min-height:70px}
.fld input[type=range]{width:100%;accent-color:var(--tc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-direction:column;gap:6px}
.seg.h{flex-direction:row}
.seg.h label{flex:1;justify-content:center}
.seg label{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px}
.seg label:has(input:checked){border-color:var(--tc);background:color-mix(in srgb,var(--tc) 8%,var(--surface))}
.seg input{accent-color:var(--tc);margin-top:5px}
.seg small{display:block;color:var(--muted);font-size:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.chk input{accent-color:var(--tc);width:16px;height:16px}
.hint{font-size:12.5px;color:var(--muted);margin:0;line-height:1.6}
.pad{display:block;width:100%;height:130px;background:var(--paper);border:1px solid var(--line);border-radius:8px;touch-action:none;cursor:crosshair}
.run{width:100%;padding:13px 16px;border:0;border-radius:10px;background:var(--tc);color:var(--surface);font-family:var(--f-display);font-weight:600;font-size:16px;cursor:pointer;transition:filter .15s}
.run:hover:not(:disabled){filter:brightness(1.08)}
.run:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:14px}
.status.err{color:var(--danger)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--tc);width:0;transition:width .2s}
.result{border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 7%,var(--surface));border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.rf{display:flex;gap:10px;align-items:center}
.rf svg{color:var(--ok);flex:none}
.rf div{min-width:0}
.rf b{display:block;font-weight:600;overflow-wrap:anywhere}
.rf span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dl{padding:10px;border-radius:8px;border:0;background:var(--ok);color:var(--surface);font-weight:600;cursor:pointer}
.dlmsg{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20;box-shadow:var(--shadow)}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.foot .by{font-family:var(--f-display);font-weight:500;color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}
</style>
</head>
<body>


<div class="app" dir="rtl" lang="ar">
  <header class="top">
    <a class="brand" href="#"><span class="mark">PDF</span>Genius PDF</a>
    <span class="privacy"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>ملفاتك تُعالَج على جهازك ولا تُرفع إلى أي خادم</span>
  </header>
  <main id="view"></main>

    document.head.appendChild(s);

}

const DONE = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>`;

/* ---------- pdf helpers ---------- */
async function loadPdf(f) {
  try { return await PDFDocument.load(f.bytes, { ignoreEncryption: true }); }
  catch (e) { throw new Error(`تعذّرت قراءة "${f.name}". تأكد أنه ملف PDF سليم وغير محمي بكلمة مرور.`); }

  lines.forEach((l, i) => x.fillText(l, 0, (i - (lines.length - 1) / 2) * lh));

}

}

    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;

/* text extraction */
async function pageLines(page) {
  const tc = await page.getTextContent();
  const rows = [];
  for (const it of tc.items) {
    if (!it.str || !it.str.trim()) continue;
    const x = it.transform[4], y = it.transform[5], h = Math.hypot(it.transform[2], it.transform[3]) || 10;
    let r = rows.find(r => Math.abs(r.y - y) < Math.max(r.h, h) * .5);
    if (!r) rows.push(r = { y, h, items: [] });
    r.items.push({ x, w: it.width, s: it.str, h });
  }
  rows.sort((a, b) => b.y - a.y);
  return rows.map(r => {
    const rtl = r.items.some(i => AR.test(i.s));
    r.items.sort((a, b) => rtl ? b.x - a.x : a.x - b.x);
    return { rtl, items: r.items, h: r.h };
  });
}
function gapOf(a, b, rtl) { return rtl ? a.x - (b.x + b.w) : b.x - (a.x + a.w); }
function lineText(l) {
  let s = '';
  l.items.forEach((it, i) => { if (i && gapOf(l.items[i - 1], it, l.rtl) > it.h * .2 && !/\s$/.test(s)) s += ' '; s += it.s; });
  return s.replace(/\s+/g, ' ').trim();
}
function lineCells(l) {
  const cells = []; let cur = '';
  l.items.forEach((it, i) => {
    if (i && gapOf(l.items[i - 1], it, l.rtl) > it.h * 1.4) { cells.push(cur.trim()); cur = ''; }
    else if (i && gapOf(l.items[i - 1], it, l.rtl) > it.h * .2) cur += ' ';
    cur += it.s;
  });
  cells.push(cur.trim());
  return cells.map(c => { const n = c.replace(/[,\s]/g, ''); return /^-?\d+(\.\d+)?$/.test(n) && n.length < 15 ? +n : c; });
}
async function pdfText(f, prog) {
  const doc = await openPdfjs(f), parts = [];
  for (let i = 1; i <= doc.numPages; i++) {
    prog?.(i - 1, doc.numPages, `قراءة الصفحة ${i} من ${doc.numPages}`);
    parts.push((await pageLines(await doc.getPage(i))).map(lineText).join('\n'));
  }
  doc.destroy();
  const t = parts.join('\n\n').trim();
  if (!t) throw new Error('لا يحتوي الملف على نص قابل للقراءة؛ يبدو أنه صور ممسوحة ضوئياً.');
  return t;
}

/* docx writer (text only) */
async function buildDocx(paras) {
  const clean = s => esc(String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, ''));
  const body = paras.map(p => {
    if (p.pageBreak) return '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
    const sz = p.big ? 30 : 22;
    return `<w:p><w:pPr>${p.rtl ? '<w:bidi/><w:jc w:val="right"/>' : ''}<w:spacing w:after="80"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${p.b ? '<w:b/><w:bCs/>' : ''}${p.rtl ? '<w:rtl/>' : ''}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${clean(p.text)}</w:t></w:r></w:p>`;
  }).join('');
  const zip = new ZipLib();
  zip.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/document.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`);
  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

/* html → pdf (Word / Excel) */
async function htmlToPdf(html, { landscape = false, prog } = {}) {
  await lib('h2c');
  const pw = landscape ? 1040 : 720;
  const rtl = (html.replace(/<[^>]+>/g, '').match(/[؀-ۿ]/g) || []).length > 20;
  const box = document.createElement('div');
  box.style.cssText = `position:fixed;left:-30000px;top:0;width:${pw}px;padding:0 4px;background:#fff;color:#111;font:14px/1.75 "IBM Plex Sans Arabic",Arial,sans-serif`;
  box.dir = rtl ? 'rtl' : 'ltr';
  box.innerHTML = `<style>.xd img{max-width:100%;height:auto}.xd table{border-collapse:collapse;width:100%;font-size:12px;margin:0 0 14px}.xd td,.xd th{border:1px solid #b8bcc6;padding:4px 7px;vertical-align:top}.xd h1{font-size:26px;margin:0 0 12px}.xd h2{font-size:21px;margin:18px 0 10px}.xd h3{font-size:17px}.xd p{margin:0 0 10px}.xd .sh{font:700 16px Arial,sans-serif;margin:8px 0}</style><div class="xd">${html}</div>`;
  document.body.appendChild(box);
  try {
    try { await document.fonts.ready; } catch (e) {}
    prog?.(1, 3, 'تنسيق الصفحات');
    const scale = Math.min(2, 30000 / Math.max(box.scrollHeight, 1));
    const canvas = await html2canvas(box, { scale, backgroundColor: '#ffffff', logging: false, useCORS: true });
    prog?.(2, 3, 'إنشاء ملف PDF');
    const [PW, PH] = landscape ? [841.89, 595.28] : [595.28, 841.89], M = 40;
    const pxPerPt = canvas.width / (PW - 2 * M), sliceH = Math.floor((PH - 2 * M) * pxPerPt);
    const out = await PDFDocument.create();
    for (let y = 0; y < canvas.height; y += sliceH) {
      const h = Math.min(sliceH, canvas.height - y);
      const c = document.createElement('canvas'); c.width = canvas.width; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, h);
      x.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      const img = await out.embedJpg(await canvasBytes(c, 'image/jpeg', .9));
      out.addPage([PW, PH]).drawImage(img, { x: M, y: PH - M - h / pxPerPt, width: PW - 2 * M, height: h / pxPerPt });
    }
    return out.save();
  } finally { box.remove(); }
}

  'jpg-to-pdf': {

      <div class="fld"><label for="o-margin">الهامش</label><select id="o-margin" name="margin"><option value="0">بدون هامش</option><option value="20" selected>صغير</option><option value="48">كبير</option></select></div>`,
    async run(files, o, prog) {

        const [pw, ph] = o.size === 'fit' ? [e.w * .75 + 2 * m, e.h * .75 + 2 * m] : o.size === 'a4p' ? [595.28, 841.89] : [841.89, 595.28];
        const s = Math.min((pw - 2 * m) / e.w, (ph - 2 * m) / e.h), w = e.w * s, h = e.h * s;

  'pdf-to-jpg': {

  'pdf-to-word': {
    cat: 'from', name: 'PDF إلى Word', accept: 'pdf', btn: 'تحويل إلى Word',
    desc: 'استخرج نص الملف إلى مستند Word قابل للتعديل، مع دعم كامل للعربية.',
    options: () => `<p class="hint">يُنقل النص مع الحفاظ على الأسطر وفواصل الصفحات واتجاه الكتابة. الصور والتنسيق الدقيق لا يُنقلان. الملفات الممسوحة ضوئياً لا تحتوي على نص.</p>`,
    async run([f], o, prog) {
      const doc = await openPdfjs(f), paras = []; let any = false;
      for (let i = 1; i <= doc.numPages; i++) {
        prog(i - 1, doc.numPages, `استخراج الصفحة ${i} من ${doc.numPages}`);
        const lines = await pageLines(await doc.getPage(i));
        const hs = lines.map(l => l.h).sort((a, b) => a - b), med = hs[Math.floor(hs.length / 2)] || 10;

      doc.destroy();

  'pdf-to-pptx': {
    cat: 'from', name: 'PDF إلى PowerPoint', accept: 'pdf', btn: 'تحويل إلى PowerPoint',
    desc: 'حوّل كل صفحة إلى شريحة في عرض تقديمي ‎.pptx.',
    options: () => `<p class="hint">كل صفحة تصبح شريحة بصورة عالية الدقة، فيبقى الشكل مطابقاً للأصل.</p>`,
    async run([f], o, prog) {
      await lib('pptx');
      const doc = await openPdfjs(f), p1 = (await doc.getPage(1)).getViewport({ scale: 1 });
      const W = 10, H = +(10 * p1.height / p1.width).toFixed(3);
      const pptx = new PptxGenJS(); pptx.defineLayout({ name: 'PDF', width: W, height: H }); pptx.layout = 'PDF';
      for (let i = 1; i <= doc.numPages; i++) {
        prog(i - 1, doc.numPages, `إنشاء الشريحة ${i} من ${doc.numPages}`);
        const { canvas, w, h } = await renderPage(doc, i, { width: 1600 });
        const s = Math.min(W / w, H / h), iw = w * s, ih = h * s;
        pptx.addSlide().addImage({ data: canvas.toDataURL('image/jpeg', .88).replace(/^data:/, ''), x: (W - iw) / 2, y: (H - ih) / 2, w: iw, h: ih });
        canvas.width = 0;
      }
      doc.destroy();
      const blob = await pptx.write({ outputType: 'blob' });
      return { blob, filename: `${baseName(f.name)}.pptx`, note: `${doc.numPages} شريحة` };
    }

  'pdf-to-excel': {
    cat: 'from', name: 'PDF إلى Excel', accept: 'pdf', btn: 'تحويل إلى Excel',
    desc: 'استخرج الجداول والأرقام من PDF إلى جدول Excel.',
    options: () => `<label class="chk"><input type="checkbox" name="one" id="o-one"> كل الصفحات في ورقة واحدة</label><p class="hint">تُقسَّم الأعمدة حسب المسافات بين النصوص، وتتحول الأرقام إلى قيم قابلة للحساب. يعمل جيداً مع الجداول البسيطة.</p>`,

  sign: {
    cat: 'sec', name: 'توقيع PDF', accept: 'pdf', btn: 'توقيع الملف',
    desc: 'ارسم توقيعك أو اكتبه وضعه على الصفحات التي تختارها.',
    options: () => `
      <div class="fld"><span class="lb">طريقة التوقيع</span>${radio('smode', [['draw', 'رسم'], ['type', 'كتابة']], 'draw', true)}</div>
      <div class="fld" id="padbox"><canvas class="pad" id="pad" aria-label="مساحة رسم التوقيع"></canvas><button type="button" class="link" id="padclear" style="align-self:flex-start">مسح التوقيع</button></div>
      <div class="fld" id="typebox" hidden><label for="o-sname">اسمك</label><input type="text" id="o-sname" name="sname" value="سليم بوزناد"></div>
      <div class="row2"><div class="fld"><label for="o-color">لون الحبر</label><select id="o-color" name="color"><option value="#0f2a8a">أزرق</option><option value="#111111">أسود</option></select></div>
      <div class="fld"><label for="o-pos">الموضع</label><select id="o-pos" name="pos"><option value="bl" selected>أسفل اليسار</option><option value="bc">أسفل الوسط</option><option value="br">أسفل اليمين</option><option value="tl">أعلى اليسار</option><option value="tr">أعلى اليمين</option></select></div></div>
      ${pagePick('last')}
      <div class="fld"><label for="o-sw">عرض التوقيع: <output id="o-sw-v">150</output> نقطة</label><input type="range" id="o-sw" name="sw" min="70" max="260" value="150"></div>`,
    mount() {
      const pad = $('#pad'), ctx = pad.getContext('2d'); let drawing = false, last;
      const fit = () => { const r = pad.getBoundingClientRect(); if (!r.width) return; pad.width = r.width * 2; pad.height = r.height * 2; state.sigInk = false; };
      fit();
      const pt = e => { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * 2, (e.clientY - r.top) * 2]; };
      pad.onpointerdown = e => { drawing = true; last = pt(e); pad.setPointerCapture(e.pointerId); };
      pad.onpointermove = e => { if (!drawing) return; const p = pt(e); ctx.strokeStyle = '#111'; ctx.lineWidth = 5; ctx.lineCap = ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; state.sigInk = true; };
      pad.onpointerup = pad.onpointercancel = () => drawing = false;
      $('#padclear').onclick = () => { ctx.clearRect(0, 0, pad.width, pad.height); state.sigInk = false; };
      $('#opts').addEventListener('change', e => { if (e.target.name === 'smode') { $('#padbox').hidden = e.target.value !== 'draw'; $('#typebox').hidden = e.target.value === 'draw'; } });
      const sw = $('#o-sw'); sw.oninput = () => $('#o-sw-v').textContent = sw.value;
    },
    async run([f], o) {
      let png, ar;
      if (o.smode === 'draw') {
        if (!state.sigInk) throw new Error('ارسم توقيعك في المربع أولاً.');
        const c = trimInk($('#pad'), o.color); png = await canvasBytes(c, 'image/png'); ar = c.height / c.width;
      } else {
        if (!o.sname.trim()) throw new Error('اكتب اسمك لإنشاء التوقيع.');
        const ti = await textImage(o.sname.trim(), 40, o.color, 0, '"Aref Ruqaa","Readex Pro",serif', 700); png = ti.bytes; ar = ti.h / ti.w;
      }
      const doc = await loadPdf(f), pages = doc.getPages(), idx = pagesOpt(o, pages.length), img = await doc.embedPng(png);
      const w = +o.sw, h = w * ar;
      idx.forEach(i => { const { width: W, height: H } = pages[i].getSize(); pages[i].drawImage(img, { ...placeBox(o.pos, W, H, w, h, 40), width: w, height: h }); });
      return { blob: pdfBlob(await doc.save()), filename: `${baseName(f.name)}-موقع.pdf`, note: `وُقّعت ${idx.length} صفحة` };
    }
  },
  watermark: {
    cat: 'edit', name: 'علامة مائية', accept: 'pdf', btn: 'إضافة العلامة',

    async run([f], o, prog) {

        } else {

  'page-numbers': {
    cat: 'edit', name: 'ترقيم الصفحات', accept: 'pdf', btn: 'إضافة الأرقام',
    desc: 'أضف أرقام الصفحات في الموضع والصيغة التي تريدها.',
    options: () => `
      <div class="fld"><label for="o-pos">الموضع</label><select id="o-pos" name="pos"><option value="bc" selected>أسفل الوسط</option><option value="br">أسفل اليمين</option><option value="bl">أسفل اليسار</option><option value="tc">أعلى الوسط</option><option value="tr">أعلى اليمين</option><option value="tl">أعلى اليسار</option></select></div>
      <div class="fld"><label for="o-fmt">الصيغة</label><select id="o-fmt" name="fmt"><option value="n">3</option><option value="nt">3 / 12</option><option value="dash">- 3 -</option><option value="page">Page 3 of 12</option></select></div>
      <div class="row2"><div class="fld"><label for="o-start">يبدأ من</label><input type="number" id="o-start" name="start" value="1" min="0"></div>
      <div class="fld"><label for="o-fs">حجم الخط</label><select id="o-fs" name="fs"><option value="9">صغير</option><option value="11" selected>متوسط</option><option value="14">كبير</option></select></div></div>
      <label class="chk"><input type="checkbox" name="skip" id="o-skip"> تخطّي الصفحة الأولى (الغلاف)</label>`,
    async run([f], o) {
      const doc = await loadPdf(f), font = await doc.embedFont(StandardFonts.Helvetica);
      const pages = doc.getPages(), fs = +o.fs, M = 28, off = o.skip ? 1 : 0, st = +o.start || 0, total = pages.length - off + st - 1;
      pages.forEach((p, i) => {
        if (i < off) return;
        const n = st + i - off, t = { n: `${n}`, nt: `${n} / ${total}`, dash: `- ${n} -`, page: `Page ${n} of ${total}` }[o.fmt];

function trimInk(src, color) {
  const x = src.getContext('2d'), { width: W, height: H } = src, d = x.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let X = 0; X < W; X++) if (d[(y * W + X) * 4 + 3] > 10) { if (X < x0) x0 = X; if (X > x1) x1 = X; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const P = 8, c = document.createElement('canvas'); c.width = x1 - x0 + P * 2; c.height = y1 - y0 + P * 2;
  const o = c.getContext('2d'); o.drawImage(src, x0 - P, y0 - P, c.width, c.height, 0, 0, c.width, c.height);
  o.globalCompositeOperation = 'source-in'; o.fillStyle = color; o.fillRect(0, 0, c.width, c.height);
  return c;
}

    <div class="chips" role="toolbar" aria-label="تصنيفات الأدوات">${CATS.filter(([id]) => !(IS_APP && id === 'ai')).map(([id, n]) => `<button class="chip" type="button" data-cat="${id}" aria-pressed="${state.cat === id}">${n}</button>`).join('')}</div>
    <div class="cards">${ids.map(id => { const t = TOOLS[id]; return `<a class="card" href="#${id}" style="--tc:var(--c-${t.cat})"><span class="ticon">${ICONS[id]}</span><b>${t.name}</b><span class="d">${t.desc}</span>${t.ai ? '<span class="tag">Claude</span>' : ''}</a>`; }).join('')}</div>
    <p class="limits">غير متوفر في هذا الإصدار لأنه يحتاج إلى خادم: حماية الملف بكلمة مرور وفكّها، التعرف الضوئي على النص OCR، تحويل PowerPoint وHTML إلى PDF، وصيغة PDF/A.</p>`;
  view.querySelectorAll('.chip').forEach(b => b.onclick = () => { state.cat = b.dataset.cat; renderHome(); });
}

function renderTool() {
  const t = state.tool, A = ACC[t.accept];
  view.innerHTML = `
    <section style="--tc:var(--c-${t.cat})">
      <a class="back" href="#">→ كل الأدوات</a>
      <div class="tool-head"><span class="ticon">${ICONS[t.id]}</span><div><h1>${t.name}</h1><p>${t.desc}</p></div></div>
      <div class="work">
        <div class="stage">
          <label class="drop" id="drop"><input class="vh" type="file" id="fin" accept="${A.attr}" ${t.multi ? 'multiple' : ''}>
            <span class="up">${UP}</span><span><b id="dropT"></b><span class="sub"><br>أو اسحبه وأفلته هنا</span></span></label>
          <button class="sample" id="sample" type="button">جرّب بملف تجريبي</button>
          <div id="list"></div>
          <div id="out"></div>
        </div>
        <aside class="panel">
          <h2>الخيارات</h2>
          <form class="opts" id="opts" onsubmit="return false">${t.options ? t.options() : '<p class="hint">لا توجد خيارات إضافية. رتّب الملفات ثم اضغط الزر.</p>'}</form>
          <button class="run" id="run" type="button">${t.btn}</button>
          <div class="status" id="status" aria-live="polite"></div>
          <div id="result"></div>
        </aside>
      </div>
    </section>`;
  const fin = $('#fin'), drop = $('#drop');
  fin.onchange = () => { addFiles(fin.files); fin.value = ''; };
  ['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', ev => addFiles(ev.dataTransfer.files));
  $('#sample').onclick = loadSamples;
  $('#run').onclick = run;
  $('#list').onclick = onListClick;
  const opts = $('#opts');
  opts.addEventListener('input', clearResult);
  opts.addEventListener('change', e => { if (e.target.name === 'pages') $('#o-custom').hidden = e.target.value !== 'custom'; });
  t.mount?.();
  renderList();
}

function renderList() {
  const t = state.tool, list = $('#list'); if (!list) return;
  const has = state.files.length > 0, A = ACC[t.accept];
  $('#drop').classList.toggle('compact', has);
  $('#dropT').textContent = has ? (t.multi ? 'أضف ملفات أخرى' : 'استبدال الملف') : (t.multi ? A.many : A.one) || A.many;
  $('#sample').hidden = has;
  $('#run').disabled = !has || state.busy;
  if (t.id === 'organize' && state.org) {
    const pages = state.org.pages, th = state.org.thumbs;
    list.innerHTML = `<div class="stage">
      <div class="org-bar"><span>${pages.length} صفحة · ${esc(state.files[0].name)}</span><button class="link" data-act="reset" type="button">استعادة الترتيب الأصلي</button></div>
      <div class="pgrid">${pages.map((p, i) => `<figure class="pg" data-i="${i}">
        <div class="pthumb">${th[p.src] ? '' : '<span class="spin"></span>'}<img data-src="${p.src}" src="${th[p.src] || ''}" ${th[p.src] ? '' : 'hidden'} alt="صفحة ${p.src + 1}" style="transform:rotate(${p.rot}deg) scale(${p.rot % 180 ? .74 : 1})"></div>
        <figcaption><span class="pn">${i + 1}</span><span>الأصل ${p.src + 1}${p.rot ? ` · ${p.rot}°` : ''}</span></figcaption>
        <div class="pact"><button class="ib" data-act="prev" ${i === 0 ? 'disabled' : ''} aria-label="تقديم" type="button">→</button><button class="ib" data-act="rot" aria-label="تدوير" type="button">↻</button><button class="ib" data-act="next" ${i === pages.length - 1 ? 'disabled' : ''} aria-label="تأخير" type="button">←</button><button class="ib del" data-act="del" aria-label="حذف" type="button">✕</button></div>
      </figure>`).join('')}</div></div>`;
    return;
  }
  const fs = state.files;
  list.innerHTML = has ? `<ol class="files">${fs.map((f, i) => `<li class="fcard" data-id="${f.id}">
    ${t.multi ? `<span class="ord">${i + 1}</span>` : ''}
    <div class="fthumb">${f.thumb ? `<img src="${f.thumb}" alt="">` : f.error ? '<b style="color:var(--danger)">!</b>' : f.ext ? `<span class="ext">${f.ext}</span>` : '<span class="spin"></span>'}</div>
    <div class="fmeta"><b title="${esc(f.name)}">${esc(f.name)}</b><span>${fmtSize(f.size)}${f.pages ? ` · ${f.pages} صفحة` : ''}</span>${f.error ? `<em>${f.error}</em>` : ''}</div>
    <div class="fact">${t.multi && fs.length > 1 ? `<button class="ib" data-act="up" ${i === 0 ? 'disabled' : ''} aria-label="تحريك للأعلى" type="button">↑</button><button class="ib" data-act="down" ${i === fs.length - 1 ? 'disabled' : ''} aria-label="تحريك للأسفل" type="button">↓</button>` : ''}<button class="ib del" data-act="rm" aria-label="إزالة" type="button">✕</button></div>
  </li>`).join('')}</ol>` : '';
}

function onListClick(e) {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act; clearResult();
  if (state.tool.id === 'organize' && state.org) {
    const P = state.org.pages;
    if (act === 'reset') { state.org.pages = Array.from({ length: state.org.n }, (_, i) => ({ src: i, rot: 0 })); return renderList(); }
    const i = +b.closest('.pg').dataset.i;
    if (act === 'del') P.splice(i, 1);
    if (act === 'rot') P[i].rot = (P[i].rot + 90) % 360;
    if (act === 'prev' && i > 0) [P[i - 1], P[i]] = [P[i], P[i - 1]];
    if (act === 'next' && i < P.length - 1) [P[i + 1], P[i]] = [P[i], P[i + 1]];
    return renderList();
  }
  const id = +b.closest('.fcard').dataset.id, F = state.files, i = F.findIndex(f => f.id === id);
  if (act === 'rm') { F.splice(i, 1); if (!F.length) state.org = null; }
  if (act === 'up' && i > 0) [F[i - 1], F[i]] = [F[i], F[i - 1]];
  if (act === 'down' && i < F.length - 1) [F[i + 1], F[i]] = [F[i], F[i + 1]];
  renderList();
}

async function addFiles(list) {
  const t = state.tool, A = ACC[t.accept];
  const arr = [...list].filter(A.test);
  if (!arr.length) return toast(A.err);
  if (arr.length < list.length) toast('تجاهلنا ملفات بصيغة غير مدعومة.');
  if (!t.multi) { arr.splice(1); state.files = []; state.org = null; }
  clearResult();
  const items = [];
  for (const f of arr) items.push({ id: ++uid, name: f.name, size: f.size, file: f, bytes: new Uint8Array(await f.arrayBuffer()), ext: t.accept === 'docx' ? 'DOCX' : t.accept === 'xlsx' ? (f.name.split('.').pop() || 'XLSX').toUpperCase() : '' });
  state.files.push(...items);
  if (t.max) state.files = state.files.slice(-t.max);
  renderList();
  for (const it of items) {
    if (t.accept === 'img') { it.thumb = URL.createObjectURL(it.file); renderList(); continue; }
    if (t.accept !== 'pdf') continue;
    try {
      const doc = await openPdfjs(it); it.pages = doc.numPages;
      const { canvas } = await renderPage(doc, 1, { width: 92 }); it.thumb = canvas.toDataURL('image/jpeg', .8);
      doc.destroy();
    } catch (e) { it.error = 'تعذّرت قراءة الملف. قد يكون تالفاً أو محمياً بكلمة مرور.'; }
    if (state.tool === t && t.id !== 'organize') renderList();
  }
  if (t.id === 'organize') { if (items[0] && !items[0].error) loadOrganize(items[0]); else renderList(); }
}

async function loadOrganize(f) {
  let doc; try { doc = await openPdfjs(f); } catch (e) { return; }
  const org = state.org = { fileId: f.id, n: doc.numPages, thumbs: {}, pages: Array.from({ length: doc.numPages }, (_, i) => ({ src: i, rot: 0 })) };
  renderList();
  for (let i = 0; i < doc.numPages; i++) {
    if (state.org !== org) break;
    const { canvas } = await renderPage(doc, i + 1, { width: 220 });
    org.thumbs[i] = canvas.toDataURL('image/jpeg', .8);
    document.querySelectorAll(`img[data-src="${i}"]`).forEach(img => { img.src = org.thumbs[i]; img.hidden = false; img.previousElementSibling?.remove(); });
  }
  doc.destroy();
}

function readOpts() {
  const o = {}, form = $('#opts'); if (!form) return o;
  form.querySelectorAll('input,select,textarea').forEach(el => {
    if (!el.name) return;
    if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else if (el.type === 'checkbox') o[el.name] = el.checked;
    else o[el.name] = el.value;
  });
  return o;
}
function clearResult() {
  state.result = null;
  const r = $('#result'); if (r) r.innerHTML = '';
  const s = $('#status'); if (s && !state.busy) { s.innerHTML = ''; s.className = 'status'; }
}

async function run() {
  if (state.busy || !state.files.length) return;
  const t = state.tool, bad = state.files.find(f => f.error);
  if (bad) return showErr(`أزل الملف "${bad.name}" أولاً؛ تعذّرت قراءته.`);
  clearResult(); state.busy = true; $('#run').disabled = true;
  const st = $('#status'), out = $('#out');
  out.innerHTML = '';
  st.innerHTML = `<span id="pt">جارٍ المعالجة…</span><div class="bar"><i id="pb"></i></div>`;
  const prog = (i, n, msg) => { const pt = $('#pt'), pb = $('#pb'); if (pt) pt.textContent = msg + '…'; if (pb) pb.style.width = Math.round(i / n * 100) + '%'; };
  const stream = txt => { let el = $('#live'); if (!el) { out.innerHTML = '<div class="aiout" id="live" dir="auto"></div>'; el = $('#live'); } el.textContent = txt; };
  if (t.ai) stream('');
  try {
    await tick();
    const res = await t.run(state.files, readOpts(), prog, stream);
    state.result = res; st.innerHTML = '';
    if (res.text) stream(res.text);
    $('#result').innerHTML = `<div class="result"><div class="rf">${DONE}<div><b>${esc(res.filename)}</b><span>${fmtSize(res.blob.size)}${res.note ? ' · ' + esc(res.note) : ''}</span></div></div>
      <button class="dl" id="dl" type="button">تنزيل الملف</button><p class="dlmsg" id="dlmsg" hidden></p></div>`;
    $('#dl').onclick = () => download(res);
  } catch (e) { console.error(e); showErr(e.message || 'حدث خطأ غير متوقع. جرّب ملفاً آخر.'); if (t.ai && !$('#live')?.textContent) out.innerHTML = ''; }
  finally { state.busy = false; const b = $('#run'); if (b) b.disabled = !state.files.length; }
}
function showErr(m) { const st = $('#status'); st.className = 'status err'; st.textContent = m; }

async function download(res) {
  const msg = $('#dlmsg'), say = m => { msg.textContent = m; msg.hidden = false; };
  if (window.PDFW_SAVE) { try { say(await window.PDFW_SAVE(res.blob, res.filename)); } catch (e) { say('تعذّر حفظ الملف: ' + (e.message || '')); } return; }
  if (window.claude?.use) {
    const d = await window.claude.use('downloads');
    if (!d) return say('الحفظ غير متاح في هذه النافذة. افتح الصفحة في المتصفح ثم حاول مجدداً.');
    try { await d.save({ filename: res.filename, data: res.blob }); say('تم حفظ الملف.'); }
    catch (e) { say({ declined: 'أُلغي الحفظ. اضغط الزر مرة أخرى متى أردت.', rate_limited: 'نافذة حفظ مفتوحة بالفعل. أكملها ثم أعد المحاولة.', too_large: 'الملف أكبر من المسموح هنا.' }[e?.code] || 'تعذّر الحفظ في هذه النافذة.'); }
    return;
  }
  const url = URL.createObjectURL(res.blob), a = document.createElement('a');
  a.href = url; a.download = res.filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  say('بدأ التنزيل.');
}

function route() {
  const id = location.hash.slice(1), t = TOOLS[id];
  if (!t) { state.tool = null; renderHome(); }
  else if (state.tool?.id !== id) {
    state.tool = { ...t, id }; state.files = []; state.org = null; state.result = null; state.sigInk = false;
    document.title = t.name + ' · Genius PDF';
    renderTool();
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>

</body>
